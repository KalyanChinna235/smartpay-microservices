spring.application.name=fraud-service
server.port=8083

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.smartpay.fraud.event

spring.datasource.url=jdbc:mysql://localhost:3306/smartpay_fraud_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:test}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info

# Kafka JSON Deserialization
spring.kafka.consumer.properties.spring.json.value.default.type=com.smartpay.fraud.event.PaymentCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false